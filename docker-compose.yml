services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dailies:latest
    command: pnpm --filter @dailies/web start
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DAILIES_DATA_DIR: /data
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: dailies:latest
    command: pnpm --filter @dailies/web worker
    shm_size: 1gb
    env_file:
      - path: .env
        required: false
    environment:
      DAILIES_DATA_DIR: /data
    volumes:
      - data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DAILIES_SITE_ADDRESS: ${DAILIES_SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
